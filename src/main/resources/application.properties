# ============================================================
# mail-automation - Konfiguration
# Alle sensiblen Werte kommen aus der Umgebung (k8s-Secret).
# ============================================================

# --- Mailkonten ---
# Konten werden in der UI unter /ui verwaltet und liegen in der Datenbank; das
# App-Passwort dort AES-GCM-verschluesselt. Der Schluessel kommt aus der Umgebung
# und nie aus der Datenbank - wer nur einen Dump hat, kann nichts entschluesseln.
# Neuen Schluessel erzeugen mit: openssl rand -base64 32
triage.crypto.key=${TRIAGE_CRYPTO_KEY:}
gmail.max-body-chars=6000

# Alt-Konfiguration aus der Ein-Konto-Zeit. Steht sie noch, uebernimmt KontoBootstrap
# sie beim Start einmalig als Konto in die Datenbank; danach kann sie aus dem Secret
# entfernt werden. Beide brauchen einen Leer-Default, sonst startet die Anwendung
# nicht mehr, sobald die Variablen weg sind.
gmail.user=${GMAIL_USER:}
gmail.app-password=${GMAIL_APP_PASSWORD:}
gmail.label-prefix=AI/

# --- LM Studio (lokales Modell auf dem Mac) ---
# Nur noch AUSGANGSWERTE: Adresse, Modellname, Temperatur, Schwelle, Batch-Groesse und
# die Vorfilter-Listen sind unter /ui/einstellungen zur Laufzeit aenderbar und liegen
# dann in der Datenbank. Diese Werte gelten, solange dort nie gespeichert wurde.
# Die Timeouts setzt der Adapter am RestClientBuilder, weil der Client je Adresse
# gebaut wird - eine feste quarkus.rest-client-Konfiguration gibt es nicht mehr.
lmstudio.url=${LMSTUDIO_URL:http://localhost:1234}
lmstudio.model=${LMSTUDIO_MODEL:google/gemma-4-26b-a4b}
lmstudio.temperature=0.0

# --- Triage ---
triage.poll-interval=${TRIAGE_POLL_INTERVAL:10m}
triage.batch-max=50
triage.confidence-schwelle=0.7
# Kommagetrennte Absender-Muster (Substring-Match, case-insensitive), die
# deterministisch entschieden werden, ohne das Modell zu fragen:
triage.vorfilter.werbung-absender=${TRIAGE_WERBUNG_ABSENDER:}
triage.vorfilter.benachrichtigung-absender=${TRIAGE_BENACHRICHTIGUNG_ABSENDER:}

# --- Digest (07:00 taeglich, Quartz-Cron) ---
digest.cron=${DIGEST_CRON:0 0 7 * * ?}
digest.zeitraum-stunden=24

# --- Datenbank ---
quarkus.datasource.db-kind=postgresql
quarkus.datasource.jdbc.url=${DB_URL:jdbc:postgresql://localhost:5432/mailtriage}
quarkus.datasource.username=${DB_USER:mailtriage}
quarkus.datasource.password=${DB_PASSWORD:}
quarkus.liquibase.migrate-at-start=true
quarkus.liquibase.change-log=db/changelog.xml
quarkus.hibernate-orm.schema-management.strategy=none

# --- Zeitzone: Fristen und Digest-Zeitpunkt in Lokalzeit ---
quarkus.scheduler.cron-type=quartz

# --- Betrieb ---
quarkus.micrometer.export.prometheus.enabled=true
quarkus.log.level=INFO
quarkus.http.port=8080

# --- Dev-Modus: Quarkus startet automatisch ein Postgres (Docker noetig) ---
%dev.quarkus.datasource.devservices.enabled=true
%dev.gmail.user=${GMAIL_USER:dev@example.com}
