# Vorlage. NICHT mit echten Werten einchecken - die echte Fassung liegt
# SOPS/age-verschluesselt im Infra-Repo (apps/mail-automation/secrets/).
apiVersion: v1
kind: Secret
metadata:
  name: mail-automation-secrets
  namespace: smarthome
type: Opaque
stringData:
  # Verschluesselt die Kontopasswoerter in der Datenbank (AES-256-GCM).
  # Erzeugen mit: openssl rand -base64 32
  # ACHTUNG: Geht dieser Schluessel verloren, sind alle gespeicherten Konten
  # unbrauchbar und muessen mit neuem App-Passwort angelegt werden.
  TRIAGE_CRYPTO_KEY: "32-byte-base64-schluessel"

  DB_URL: "jdbc:postgresql://postgres:5432/mailtriage"
  DB_USER: "mailtriage"
  DB_PASSWORD: "..."

  # Optionale Vorfilter (kommagetrennte Absender-Muster):
  # TRIAGE_WERBUNG_ABSENDER: "news.aldi,shop@"
  # TRIAGE_BENACHRICHTIGUNG_ABSENDER: "noreply-accounts@google.com"

  # Alt-Konfiguration aus der Ein-Konto-Zeit: stehen beide, wird daraus beim
  # ersten Start einmalig ein Konto angelegt. Fuer eine Neuinstallation nicht
  # noetig - Postfaecher werden in der Oberflaeche unter /ui erfasst.
  # GMAIL_USER: "deine-adresse@gmail.com"
  # GMAIL_APP_PASSWORD: "16zeichenapppwd"
